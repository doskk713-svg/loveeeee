<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowers For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06060c;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .hidden {
      display: none !important;
    }

    /* ប៊ូតុងបើក/បិទភ្លេង */
    .music-toggle-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 60;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(216, 180, 254, 0.55);
      background: rgba(24, 12, 46, 0.78);
      color: #f3d9ff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.45);
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .music-toggle-btn:hover {
      transform: scale(1.05);
      background: rgba(45, 20, 82, 0.9);
    }

    /* Intro Screen */
    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, #180c2e 0%, #06060c 75%);
      cursor: pointer;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .intro-content {
      text-align: center;
    }

    .tap-text {
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #f3d9ff;
      text-shadow:
        0 0 10px rgba(192, 108, 255, 0.9),
        0 0 26px rgba(155, 65, 255, 0.7),
        0 0 48px rgba(120, 40, 230, 0.5);
      animation: pulseText 2s ease-in-out infinite;
    }

    .glow-heart {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      filter: drop-shadow(0 0 14px rgba(186, 85, 255, 0.95))
              drop-shadow(0 0 32px rgba(140, 50, 255, 0.8));
      animation: beatHeart 1.5s ease-in-out infinite;
    }

    .heart-click-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      margin: 18px auto 0;
      border-radius: 22px;
      background: rgba(168, 85, 247, 0.16);
      border: 1.5px solid rgba(216, 180, 254, 0.55);
      box-shadow:
        0 0 18px rgba(168, 85, 247, 0.45),
        inset 0 0 14px rgba(216, 180, 254, 0.2);
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .heart-click-box:hover {
      transform: scale(1.08);
      background: rgba(186, 104, 255, 0.26);
      box-shadow:
        0 0 26px rgba(192, 132, 252, 0.75),
        inset 0 0 18px rgba(233, 213, 255, 0.35);
    }

    .heart-click-box:active {
      transform: scale(0.96);
    }

    .heart-click-box .glow-heart {
      margin-top: 0;
    }

    .heart-prompt-text {
      margin: 14px auto 0;
      max-width: min(90vw, 520px);
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      line-height: 1.6;
      font-weight: 600;
      color: #f3d9ff;
      text-shadow: 0 0 12px rgba(192, 108, 255, 0.75);
    }

    .hope-message-text {
      margin: 10px auto 0;
      max-width: min(88vw, 480px);
      font-size: clamp(0.95rem, 2.4vw, 1.18rem);
      line-height: 1.65;
      color: #e9d5ff;
      text-shadow: 0 0 10px rgba(155, 65, 255, 0.55);
    }

    @keyframes pulseText {
      0%, 100% {
        opacity: 0.85;
        transform: scale(0.98);
      }
      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    @keyframes beatHeart {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.16);
      }
    }

    /* Main Scene */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .scene.active {
      opacity: 1;
    }

    #sky-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Heading */
    .title {
      position: relative;
      z-index: 5;
      padding-top: clamp(24px, 5vh, 52px);
      text-align: center;
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f6e2ff;
      text-shadow:
        0 0 12px rgba(212, 130, 255, 0.9),
        0 0 28px rgba(158, 62, 255, 0.75),
        0 0 50px rgba(112, 32, 224, 0.55);
      animation: titleFloat 4s ease-in-out infinite;
    }

    @keyframes titleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    /* Bouquet Stage - ដាក់ឲ្យចំពាក់កណ្ដាលអេក្រង់ */
    .bouquet-stage {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 360px;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Flowers Group */
    .flowers-group {
      position: absolute;
      bottom: 112px;
      width: 240px;
      height: 220px;
      z-index: 2;
      animation: breezeSway 4.8s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes breezeSway {
      0%, 100% {
        transform: rotate(-1.5deg);
      }
      50% {
        transform: rotate(1.8deg);
      }
    }

    .tulip {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform-origin: bottom center;
    }

    .tulip-1 {
      transform: translateX(-78px) rotate(-18deg);
      --stem-h: 115px;
      --delay: 0.25s;
    }

    .tulip-2 {
      transform: translateX(-38px) rotate(-8deg);
      --stem-h: 142px;
      --delay: 0.45s;
    }

    .tulip-3 {
      transform: translateX(0px) rotate(0deg);
      --stem-h: 162px;
      --delay: 0.65s;
      z-index: 3;
    }

    .tulip-4 {
      transform: translateX(38px) rotate(8deg);
      --stem-h: 142px;
      --delay: 0.85s;
    }

    .tulip-5 {
      transform: translateX(78px) rotate(18deg);
      --stem-h: 115px;
      --delay: 1.05s;
    }

    .stem {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 0;
      background: linear-gradient(to top, #2e8b57, #6ee7b7);
      border-radius: 999px;
      transition: height 1.1s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0.3s);
    }

    .scene.bloom .stem {
      height: var(--stem-h, 130px);
    }

    .leaf {
      position: absolute;
      bottom: 26px;
      width: 34px;
      height: 14px;
      background: linear-gradient(90deg, #34d399, #10b981);
      border-radius: 100% 0 100% 0;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.6s ease calc(var(--delay, 0.3s) + 0.4s),
                  transform 0.7s ease calc(var(--delay, 0.3s) + 0.4s);
    }

    .leaf-left {
      right: 4px;
      transform-origin: right center;
    }

    .leaf-right {
      left: 4px;
      transform-origin: left center;
      border-radius: 0 100% 0 100%;
    }

    .scene.bloom .leaf {
      opacity: 0.9;
      transform: scale(1);
    }

    .tulip-head {
      position: absolute;
      bottom: calc(var(--stem-h, 130px) - 8px);
      left: 50%;
      width: 44px;
      height: 46px;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--delay, 0.3s) + 0.55s);
      filter: drop-shadow(0 0 10px rgba(196, 113, 255, 0.85))
              drop-shadow(0 0 20px rgba(145, 58, 255, 0.6));
    }

    .scene.bloom .tulip-head {
      transform: translateX(-50%) scale(1);
    }

    .petal {
      position: absolute;
      bottom: 0;
      border-radius: 50% 50% 35% 35%;
      transition: transform 0.9s ease calc(var(--delay, 0.3s) + 0.75s);
    }

    .petal-back {
      left: 9px;
      width: 26px;
      height: 40px;
      background: linear-gradient(to top, #7e22ce, #d8b4fe);
    }

    .petal-left {
      left: 1px;
      width: 22px;
      height: 36px;
      background: linear-gradient(to top, #9333ea, #e9d5ff);
      transform-origin: bottom right;
    }

    .petal-right {
      right: 1px;
      width: 22px;
      height: 36px;
      background: linear-gradient(to top, #9333ea, #e9d5ff);
      transform-origin: bottom left;
    }

    .petal-front {
      left: 8px;
      width: 28px;
      height: 34px;
      background: linear-gradient(to top, #a855f7, #f3e8ff);
    }

    .scene.bloom .petal-left {
      transform: rotate(-16deg);
    }

    .scene.bloom .petal-right {
      transform: rotate(16deg);
    }

    /* Purple Bouquet Wrapper */
    .bouquet-wrapper {
      position: relative;
      width: 220px;
      height: 132px;
      margin-bottom: 22px;
      z-index: 4;
    }

    .wrapper-back {
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 62px;
      background: linear-gradient(to bottom, #ede9fe, #c4b5fd);
      clip-path: polygon(8% 100%, 0% 25%, 22% 0%, 50% 22%, 78% 0%, 100% 25%, 92% 100%);
    }

    .wrapper-left {
      position: absolute;
      bottom: 12px;
      left: 4px;
      width: 112px;
      height: 92px;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      clip-path: polygon(0% 0%, 100% 35%, 78% 100%, 26% 100%);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .wrapper-right {
      position: absolute;
      bottom: 12px;
      right: 4px;
      width: 112px;
      height: 92px;
      background: linear-gradient(225deg, #c084fc, #7e22ce);
      clip-path: polygon(0% 35%, 100% 0%, 74% 100%, 22% 100%);
    }

    .wrapper-front {
      position: absolute;
      bottom: 10px;
      left: 34px;
      width: 152px;
      height: 76px;
      background: linear-gradient(to bottom, #b565ff, #7e22ce);
      clip-path: polygon(0% 12%, 100% 12%, 78% 100%, 22% 100%);
      filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.55));
    }

    /* Ribbon Bow */
    .ribbon-bow {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 40px;
      z-index: 5;
    }

    .bow-loop {
      position: absolute;
      top: 4px;
      width: 26px;
      height: 18px;
      border: 4px solid #e9d5ff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(216, 180, 254, 0.8);
    }

    .bow-loop.left {
      left: 8px;
      transform: rotate(-18deg);
    }

    .bow-loop.right {
      right: 8px;
      transform: rotate(18deg);
    }

    .bow-knot {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: #f3e8ff;
    }

    .bow-tail {
      position: absolute;
      top: 18px;
      width: 10px;
      height: 20px;
      background: linear-gradient(to bottom, #e9d5ff, #a855f7);
      border-radius: 2px;
    }

    .bow-tail.left {
      left: 25px;
      transform: rotate(16deg);
    }

    .bow-tail.right {
      right: 25px;
      transform: rotate(-16deg);
    }

    /* Pink Envelope Button */
    .envelope-btn {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%) translateY(12px) scale(0.7);
      width: 66px;
      height: 44px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(145deg, #ff9ebb, #ff6b9d);
      box-shadow:
        0 6px 18px rgba(255, 107, 157, 0.55),
        0 0 14px rgba(255, 182, 213, 0.6);
      cursor: pointer;
      z-index: 8;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .envelope-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .envelope-btn.visible:hover {
      transform: translateX(-50%) translateY(-3px) scale(1.06);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: linear-gradient(to bottom, #ffc2d4, #ff85b3);
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
    }

    .envelope-heart {
      position: relative;
      z-index: 2;
      display: inline-block;
      margin-top: 14px;
      font-size: 15px;
      color: #fff0f6;
      text-shadow: 0 1px 4px rgba(190, 24, 93, 0.6);
    }

    /* អក្សរនៅពីក្រោមបាច់ផ្កា និងស្រោមសំបុត្រ (ចំពាក់កណ្ដាលក្រោមបាច់ផ្កា) */
    .below-bouquet-text {
      position: absolute;
      left: 50%;
      bottom: -16px;
      transform: translateX(-50%);
      z-index: 9;
      width: max-content;
      max-width: 92vw;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(18, 9, 36, 0.72);
      border: 1px solid rgba(249, 168, 212, 0.45);
      color: #fbcfe8;
      font-size: clamp(0.88rem, 2.3vw, 1.08rem);
      font-weight: 600;
      text-align: center;
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.75);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.35);
      cursor: pointer;
    }

    /* Love Letter Modal Card */
    .letter-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(6, 6, 14, 0.58);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .letter-backdrop.open {
      opacity: 1;
    }

    .letter-card {
      width: min(92vw, 390px);
      background: #fffdfd;
      border-radius: 18px;
      padding: 12px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(244, 114, 182, 0.35);
      transform: scale(0.82) translateY(18px);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .letter-backdrop.open .letter-card {
      transform: scale(1) translateY(0);
    }

    .letter-inner {
      border: 2px dashed #f9a8d4;
      border-radius: 13px;
      padding: 22px 20px;
      text-align: center;
      color: #3f2e3e;
    }

    .letter-heading {
      font-size: 1.65rem;
      font-weight: 700;
      color: #be185d;
      margin-bottom: 10px;
    }

    .letter-message {
      font-size: 0.98rem;
      line-height: 1.55;
      color: #4b3b4c;
      margin-bottom: 12px;
    }

    /* Hugging Bear & Panda */
    .hug-illustration {
      position: relative;
      width: 220px;
      height: 130px;
      margin: 4px auto 10px;
    }

    .characters-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .hug-illustration:hover .bear-group {
      transform: translateX(3px);
      transition: transform 0.3s ease;
    }

    .hug-illustration:hover .panda-group {
      transform: translateX(-3px);
      transition: transform 0.3s ease;
    }

    .floating-heart {
      position: absolute;
      top: 2px;
      font-size: 15px;
      color: #ec4899;
      opacity: 0;
      animation: floatUpHeart 2.4s ease-in-out infinite;
    }

    .fh-1 {
      left: 68px;
      animation-delay: 0s;
    }

    .fh-2 {
      left: 108px;
      font-size: 18px;
      animation-delay: 0.8s;
    }

    .fh-3 {
      left: 146px;
      animation-delay: 1.6s;
    }

    @keyframes floatUpHeart {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.7);
      }
      40% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-22px) scale(1.15);
      }
    }

    .letter-footer {
      font-size: 0.92rem;
      font-weight: 600;
      color: #9d174d;
    }
  </style>
</head>
<body>
  <!-- ប៊ូតុងបើក/បិទភ្លេង -->
  <button id="music-toggle-btn" class="music-toggle-btn" type="button" aria-label="បើក ឬបិទភ្លេង">
    🎵 បិទភ្លេង
  </button>

  <!-- ដាក់ Link ភ្លេង MP3 របស់អ្នកនៅត្រង់ src="..." (បើទុកទទេ វានឹងលេងភ្លេងទន់ៗស្វ័យប្រវត្តិ) -->
  <audio id="bg-music" loop preload="auto" src=""></audio>

  <!-- Intro Screen: TAP TO OPEN -->
  <div id="intro-screen" class="intro-screen" role="button" tabindex="0" aria-label="Tap to open">
    <div class="intro-content">
      <p class="tap-text">TAP TO OPEN</p>

      <div id="heart-action-box" class="heart-click-box" role="button" tabindex="0" aria-label="សូមចុចលើរូប បេះដូងដើម្បីបើកកាដូររបស់អ្នក♾️🎁">
        <div class="glow-heart" aria-hidden="true">💜</div>
      </div>

      <p class="heart-prompt-text">សូមចុចលើរូប បេះដូងដើម្បីបើកកាដូររបស់អ្នក♾️🎁</p>
      <p class="hope-message-text">បងសង្ឃឹមថ្ងៃណាមួយអូន ចន្ធី ~ នាង និងស្រឡាញ់បង 💖🫶</p>
    </div>
  </div>

  <!-- Main Scene -->
  <main id="scene" class="scene hidden">
    <canvas id="sky-canvas"></canvas>

    <h1 class="title">Flowers For You</h1>

    <!-- Bouquet & Interactive Envelope -->
    <div class="bouquet-stage">
      <!-- Growing Stems & Blooming Purple Tulips -->
      <div class="flowers-group" id="flowers-group">
        <!-- Tulip 1 (Left) -->
        <div class="tulip tulip-1">
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="tulip-head">
            <span class="petal petal-back"></span>
            <span class="petal petal-left"></span>
            <span class="petal petal-right"></span>
            <span class="petal petal-front"></span>
          </div>
        </div>

        <!-- Tulip 2 (Inner Left) -->
        <div class="tulip tulip-2">
          <div class="stem"></div>
          <div class="tulip-head">
            <span class="petal petal-back"></span>
            <span class="petal petal-left"></span>
            <span class="petal petal-right"></span>
            <span class="petal petal-front"></span>
          </div>
        </div>

        <!-- Tulip 3 (Center Tall) -->
        <div class="tulip tulip-3">
          <div class="stem"></div>
          <div class="leaf leaf-right"></div>
          <div class="tulip-head">
            <span class="petal petal-back"></span>
            <span class="petal petal-left"></span>
            <span class="petal petal-right"></span>
            <span class="petal petal-front"></span>
          </div>
        </div>

        <!-- Tulip 4 (Inner Right) -->
        <div class="tulip tulip-4">
          <div class="stem"></div>
          <div class="tulip-head">
            <span class="petal petal-back"></span>
            <span class="petal petal-left"></span>
            <span class="petal petal-right"></span>
            <span class="petal petal-front"></span>
          </div>
        </div>

        <!-- Tulip 5 (Right) -->
        <div class="tulip tulip-5">
          <div class="stem"></div>
          <div class="leaf leaf-right"></div>
          <div class="tulip-head">
            <span class="petal petal-back"></span>
            <span class="petal petal-left"></span>
            <span class="petal petal-right"></span>
            <span class="petal petal-front"></span>
          </div>
        </div>
      </div>

      <!-- Purple Folded Bouquet Wrapper -->
      <div class="bouquet-wrapper">
        <div class="wrapper-back"></div>
        <div class="wrapper-left"></div>
        <div class="wrapper-right"></div>
        <div class="wrapper-front"></div>
        <div class="ribbon-bow">
          <span class="bow-loop left"></span>
          <span class="bow-loop right"></span>
          <span class="bow-knot"></span>
          <span class="bow-tail left"></span>
          <span class="bow-tail right"></span>
        </div>
      </div>

      <!-- Pink Envelope Button -->
      <button id="envelope-btn" class="envelope-btn" type="button" aria-label="Open love letter">
        <span class="envelope-flap"></span>
        <span class="envelope-heart">♥</span>
      </button>

      <!-- អក្សរពីក្រោមបាច់ផ្កា និងស្រោមសំបុត្រ -->
      <p id="below-bouquet-btn" class="below-bouquet-text">
        ចុចលើសំបុណ្យកាដូររបស់អ្នក 🎁
      </p>
    </div>

    <!-- Love Letter Modal Card -->
    <div id="letter-backdrop" class="letter-backdrop hidden" aria-hidden="true">
      <article id="letter-card" class="letter-card" role="dialog" aria-modal="true" aria-labelledby="letter-heading">
        <div class="letter-inner">
          <h2 id="letter-heading" class="letter-heading">Dear Love Chanthy ~ Neang</h2>
          <p class="letter-message">
            Today is not a special date, but for me it is a unique day.
          </p>

          <!-- Cute Bear & Panda Hugging Illustration with Floating Hearts -->
          <div class="hug-illustration" aria-hidden="true">
            <span class="floating-heart fh-1">♥</span>
            <span class="floating-heart fh-2">♥</span>
            <span class="floating-heart fh-3">♥</span>

            <svg viewBox="0 0 220 130" class="characters-svg">
              <!-- Brown Bear (Left) -->
              <g class="bear-group">
                <circle cx="64" cy="34" r="11" fill="#8d5524" />
                <circle cx="64" cy="34" r="6" fill="#c68642" />
                <circle cx="102" cy="34" r="11" fill="#8d5524" />
                <circle cx="102" cy="34" r="6" fill="#c68642" />
                <ellipse cx="83" cy="56" rx="26" ry="23" fill="#a46832" />
                <ellipse cx="83" cy="62" rx="11" ry="8" fill="#e0ac69" />

                <circle cx="92" cy="53" r="3" fill="#2b1b10" />
                <circle cx="83" cy="60" r="3.5" fill="#2b1b10" />
                <path d="M78 65 Q83 70 88 65" stroke="#2b1b10" stroke-width="2" fill="none" stroke-linecap="round" />
                <!-- Body & Hugging Arm -->
                <ellipse cx="84" cy="96" rx="24" ry="24" fill="#a46832" />
                <ellipse cx="84" cy="98" rx="14" ry="15" fill="#e0ac69" />
                <path d="M102 84 Q122 88 124 98" stroke="#8d5524" stroke-width="11" stroke-linecap="round" fill="none" />
                <ellipse cx="68" cy="118" rx="10" ry="7" fill="#8d5524" />
                <ellipse cx="98" cy="118" rx="10" ry="7" fill="#8d5524" />
              </g>

              <!-- White Panda (Right) -->
              <g class="panda-group">
                <circle cx="122" cy="35" r="10" fill="#2b2d42" />
                <circle cx="158" cy="35" r="10" fill="#2b2d42" />
                <ellipse cx="140" cy="57" rx="25" ry="22" fill="#ffffff" stroke="#d8dde6" stroke-width="1.5" />
                <!-- Eye Patches -->
                <ellipse cx="131" cy="54" rx="6.5" ry="8" transform="rotate(-15 131 54)" fill="#2b2d42" />
                <ellipse cx="149" cy="54" rx="6.5" ry="8" transform="rotate(15 149 54)" fill="#2b2d42" />
                <circle cx="132" cy="53" r="2.2" fill="#ffffff" />
                <circle cx="148" cy="53" r="2.2" fill="#ffffff" />
                <ellipse cx="140" cy="61" rx="3.5" ry="2.5" fill="#2b2d42" />
                <path d="M135 66 Q140 70 145 66" stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round" />
                <!-- Body & Hugging Arm -->
                <ellipse cx="138" cy="96" rx="23" ry="23" fill="#ffffff" stroke="#d8dde6" stroke-width="1.5" />
                <ellipse cx="138" cy="98" rx="13" ry="14" fill="#f3f5f8" />
                <path d="M120 85 Q102 90 100 100" stroke="#2b2d42" stroke-width="10" stroke-linecap="round" fill="none" />
                <ellipse cx="124" cy="118" rx="10" ry="7" fill="#2b2d42" />

            </svg>
          </div>

          <p class="letter-footer">I like you just the way you are. Happy month.</p>

  </main>

  <script>
    const introScreen = document.getElementById("intro-screen");
    const heartActionBox = document.getElementById("heart-action-box");
    const scene = document.getElementById("scene");
    const envelopeBtn = document.getElementById("envelope-btn");
    const belowBouquetBtn = document.getElementById("below-bouquet-btn");
    const letterBackdrop = document.getElementById("letter-backdrop");
    const letterCard = document.getElementById("letter-card");
    const musicToggleBtn = document.getElementById("music-toggle-btn");
    const bgMusic = document.getElementById("bg-music");
    const canvas = document.getElementById("sky-canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let stars = [];
    let shootingStars = [];
    let animationId = null;

    // ប្រព័ន្ធភ្លេងទន់ៗស្វ័យប្រវត្តិ (Web Audio API) ឬប្រើ Link MP3 របស់អ្នកក្នុង <audio src="...">
    let audioCtx = null;
    let synthTimer = null;
    let isMusicPlaying = false;

    const melodyNotes = [261.63, 329.63, 392.00, 493.88, 523.25, 392.00, 329.63, 293.66];
    let noteIndex = 0;

    function playSoftTone(freq) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.55);
    }

    function startSynthLoop() {
      if (synthTimer) return;
      playSoftTone(melodyNotes[noteIndex % melodyNotes.length]);
      noteIndex++;
      synthTimer = setInterval(() => {
        playSoftTone(melodyNotes[noteIndex % melodyNotes.length]);
        noteIndex++;
      }, 950);
    }

    function stopSynthLoop() {
      if (synthTimer) {
        clearInterval(synthTimer);
        synthTimer = null;
      }
    }

    async function startMusic() {
      const customSrc = (bgMusic.getAttribute("src") || "").trim();
      if (customSrc) {
        try {
          await bgMusic.play();
          isMusicPlaying = true;
          musicToggleBtn.textContent = "🎵 បិទភ្លេង";
          return;
        } catch (err) {
          // ប្រសិនបើ Link MP3 មិនអាចលេងបាន នឹងបង្វែរទៅប្រើភ្លេងទន់ស្វ័យប្រវត្តិ
        }
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      startSynthLoop();
      isMusicPlaying = true;
      musicToggleBtn.textContent = "🎵 បិទភ្លេង";
    }

    function stopMusic() {
      const customSrc = (bgMusic.getAttribute("src") || "").trim();
      if (customSrc && !bgMusic.paused) {
        bgMusic.pause();
      }
      stopSynthLoop();
      isMusicPlaying = false;
      musicToggleBtn.textContent = "🔇 បើកភ្លេង";
    }

    musicToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (isMusicPlaying) {
        stopMusic();
      } else {
        startMusic();
      }
    });

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
    }

    function createStars() {
      const count = Math.min(220, Math.floor((width * height) / 5500));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * (height * 0.78),
        r: Math.random() * 1.6 + 0.4,
        alpha: Math.random() * 0.8 + 0.2,
        twinkleSpeed: Math.random() * 0.025 + 0.008,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function spawnShootingStar() {
      const startX = Math.random() * width * 0.8 + width * 0.1;
      const startY = Math.random() * height * 0.35;
      shootingStars.push({
        x: startX,
        y: startY,
        len: Math.random() * 75 + 45,
        vx: -(Math.random() * 5 + 5),
        vy: Math.random() * 2.5 + 2,
        life: 1,
        decay: Math.random() * 0.018 + 0.012,
      });
    }

    function drawSky(time) {
      ctx.clearRect(0, 0, width, height);

      const horizonY = height * 0.72;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, "#05050d");
      skyGrad.addColorStop(0.55, "#110b29");
      skyGrad.addColorStop(0.72, "#2b1954");
      skyGrad.addColorStop(0.73, "#6d4aff");
      skyGrad.addColorStop(1, "#090714");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      const glowGrad = ctx.createRadialGradient(
        width * 0.5,
        horizonY,
        10,
        width * 0.5,
        horizonY,
        Math.max(width * 0.45, 260)
      );
      glowGrad.addColorStop(0, "rgba(180, 130, 255, 0.35)");
      glowGrad.addColorStop(1, "rgba(180, 130, 255, 0)");
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, width, height);

      for (const s of stars) {
        const twinkle = 0.5 + 0.5 * Math.sin(time * 0.001 * (s.twinkleSpeed * 60) + s.phase);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245, 240, 255, ${(s.alpha * twinkle).toFixed(3)})`;
        ctx.fill();
      }

      if (Math.random() < 0.014 && shootingStars.length < 3) {
        spawnShootingStar();
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const st = shootingStars[i];
        const tailX = st.x - st.vx * (st.len / 6);
        const tailY = st.y - st.vy * (st.len / 6);

        const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255, 255, 255, ${st.life})`);
        grad.addColorStop(1, "rgba(216, 180, 254, 0)");

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        st.x += st.vx;
        st.y += st.vy;
        st.life -= st.decay;

        if (st.life <= 0 || st.x < 0 || st.y > height) {
          shootingStars.splice(i, 1);
        }
      }

      animationId = requestAnimationFrame(drawSky);
    }

    function openExperience() {
      startMusic();

      if (!introScreen || introScreen.classList.contains("fade-out")) return;

      introScreen.classList.add("fade-out");
      scene.classList.remove("hidden");
      resizeCanvas();

      requestAnimationFrame(() => {
        scene.classList.add("active");
        scene.classList.add("bloom");
      });

      if (!animationId) {
        animationId = requestAnimationFrame(drawSky);
      }

      setTimeout(() => {
        envelopeBtn.classList.add("visible");
      }, 2100);

      setTimeout(() => {
        introScreen.classList.add("hidden");
      }, 750);
    }

    function openLetter() {
      letterBackdrop.classList.remove("hidden");
      letterBackdrop.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => {
        letterBackdrop.classList.add("open");
      });
    }

    function closeLetter() {
      letterBackdrop.classList.remove("open");
      letterBackdrop.setAttribute("aria-hidden", "true");
      setTimeout(() => {
        if (!letterBackdrop.classList.contains("open")) {
          letterBackdrop.classList.add("hidden");
        }
      }, 350);
    }

    introScreen.addEventListener("click", openExperience);
    introScreen.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openExperience();
      }
    });

    heartActionBox.addEventListener("click", (e) => {
      e.stopPropagation();
      openExperience();
    });

    heartActionBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        e.stopPropagation();
        openExperience();
      }
    });

    envelopeBtn.addEventListener("click", openLetter);
    belowBouquetBtn.addEventListener("click", openLetter);

    letterBackdrop.addEventListener("click", closeLetter);
    letterCard.addEventListener("click", closeLetter);

    window.addEventListener("resize", () => {
      if (!scene.classList.contains("hidden")) {
        resizeCanvas();
      }
    });
  </script>
</body>
